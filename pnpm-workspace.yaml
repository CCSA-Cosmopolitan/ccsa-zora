packages:
  - "apps/*"
  - "packages/*"

# Expo Router exposes optional web/animation/testing integrations as peers. Keep
# the native field client lean and add only peers the app imports explicitly.
autoInstallPeers: false

# Security pins for upstream Expo/Next transitive dependencies. Keep these
# until their direct dependency ranges include the patched releases.
overrides:
  "@xmldom/xmldom": "0.8.13"
  "postcss": "8.5.25"
  "sharp": "0.35.3"
  "uuid": "11.1.1"
  "yaml": "2.9.0"

catalog:
  "@types/node": "^26.6.5"
  "@types/react": "^19.3.0"
  "@types/react-dom": "^19.3.0"
  "react": "19.3.1"
  "react-dom": "19.3.1"
  "typescript": "7.0.2"
